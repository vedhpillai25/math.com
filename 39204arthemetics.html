<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>39204 arthemetics</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      transition: background-color 0.5s ease;
    }
    body.win-bg {
      background-color: #14532d; /* Green (> 10) */
    }
    body.lose-bg {
      background-color: #7f1d1d; /* Red (< 10) */
    }
    body.neutral-bg {
      background-color: #1e293b; /* Neutral (= 10) */
    }
    .game-box {
      background: #161e31;
      padding: 35px 40px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #293548;
      text-align: center;
      width: 340px;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #f8fafc;
      font-size: 24px;
      letter-spacing: 0.5px;
    }
    .question {
      font-size: 38px;
      font-weight: bold;
      color: #38bdf8;
      margin: 20px 0;
      padding: 18px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }
    .option-btn {
      background-color: #1e293b;
      color: #f8fafc;
      border: 2px solid #334155;
      padding: 14px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .option-btn:hover {
      background-color: #0284c7;
      border-color: #38bdf8;
    }
    .control-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    button.action-btn {
      color: white;
      border: none;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .skip-btn {
      background-color: #d97706;
    }
    .skip-btn:hover {
      background-color: #b45309;
    }
    .end-btn {
      background-color: #475569;
    }
    .end-btn:hover {
      background-color: #334155;
    }
    .restart-btn {
      background-color: #0284c7;
    }
    .restart-btn:hover {
      background-color: #0369a1;
    }
    .feedback {
      margin-top: 12px;
      font-weight: bold;
      min-height: 24px;
    }
    .correct { color: #4ade80; }
    .wrong { color: #f87171; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="game-box">
    <h1>39204 arthemetics</h1>
    
    <div id="play-area">
      <div class="question" id="question">Loading...</div>
      
      <div class="options-grid" id="options-grid">
        <button class="option-btn"></button>
        <button class="option-btn"></button>
        <button class="option-btn"></button>
        <button class="option-btn"></button>
      </div>

      <div class="control-row">
        <button id="skip-btn" class="action-btn skip-btn">Skip</button>
        <button id="end-btn" class="action-btn end-btn">End Game</button>
      </div>
      
      <div class="feedback" id="feedback"></div>
    </div>

    <div id="end-area" class="hidden">
      <div class="question" id="final-message">Game Over!</div>
      <p id="final-score-text" style="font-size: 22px; font-weight: bold; margin-bottom: 20px;"></p>
      <button id="restart-btn" class="action-btn restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    let score = 0;
    let questionPool = [];
    let currentQuestion = null;

    const questionEl = document.getElementById('question');
    const optionButtons = document.querySelectorAll('.option-btn');
    const skipBtn = document.getElementById('skip-btn');
    const endBtn = document.getElementById('end-btn');
    const restartBtn = document.getElementById('restart-btn');
    const feedbackEl = document.getElementById('feedback');
    const playArea = document.getElementById('play-area');
    const endArea = document.getElementById('end-area');
    const finalMessage = document.getElementById('final-message');
    const finalScoreText = document.getElementById('final-score-text');

    // Generate all possible unique equations for 1–99 across +, -, ×, ÷
    function buildAllQuestions() {
      const all = [];
      for (let a = 1; a <= 99; a++) {
        for (let b = 1; b <= 99; b++) {
          all.push({ text: `${a} + ${b}`, answer: a + b });
          if (a >= b) {
            all.push({ text: `${a} - ${b}`, answer: a - b });
          }
          all.push({ text: `${a} × ${b}`, answer: a * b });
          if (a % b === 0) {
            all.push({ text: `${a} ÷ ${b}`, answer: a / b });
          }
        }
      }

      // Fisher-Yates shuffle
      for (let i = all.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [all[i], all[j]] = [all[j], all[i]];
      }
      return all;
    }

    // Create 4 unique choices with only 1 correct answer
    function generateOptions(correctAnswer) {
      const optionsSet = new Set([correctAnswer]);

      while (optionsSet.size < 4) {
        // Generate realistic nearby distractors (offsets between -15 and +15, or ±10/±20)
        const offsetChoices = [-20, -12, -10, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 10, 12, 20];
        const randomOffset = offsetChoices[Math.floor(Math.random() * offsetChoices.length)];
        const distractor = correctAnswer + randomOffset;

        if (distractor >= 0 && distractor !== correctAnswer) {
          optionsSet.add(distractor);
        }
      }

      const optionsArray = Array.from(optionsSet);
      // Shuffle the 4 options
      for (let i = optionsArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [optionsArray[i], optionsArray[j]] = [optionsArray[j], optionsArray[i]];
      }
      return optionsArray;
    }

    function nextQuestion() {
      if (questionPool.length === 0) {
        endGame();
        return;
      }
      currentQuestion = questionPool.pop();
      questionEl.textContent = currentQuestion.text;

      const choices = generateOptions(currentQuestion.answer);
      optionButtons.forEach((btn, index) => {
        btn.textContent = choices[index];
      });
    }

    function handleChoice(selectedValue) {
      if (selectedValue === currentQuestion.answer) {
        score += 1;
        feedbackEl.textContent = 'Correct!';
        feedbackEl.className = 'feedback correct';
      } else {
        feedbackEl.textContent = `Wrong! It was ${currentQuestion.answer}`;
        feedbackEl.className = 'feedback wrong';
      }
      nextQuestion();
    }

    function skipQuestion() {
      feedbackEl.textContent = `Skipped (Wrong)! Answer was ${currentQuestion.answer}`;
      feedbackEl.className = 'feedback wrong';
      nextQuestion();
    }

    function endGame() {
      playArea.classList.add('hidden');
      endArea.classList.remove('hidden');

      finalScoreText.textContent = `Final Score: ${score}`;

      document.body.classList.remove('win-bg', 'lose-bg', 'neutral-bg');
      if (score > 10) {
        document.body.classList.add('win-bg');
        finalMessage.textContent = 'You Win!';
        finalMessage.style.color = '#4ade80';
      } else if (score < 10) {
        document.body.classList.add('lose-bg');
        finalMessage.textContent = 'Game Over!';
        finalMessage.style.color = '#f87171';
      } else {
        document.body.classList.add('neutral-bg');
        finalMessage.textContent = 'Score is 10!';
        finalMessage.style.color = '#38bdf8';
      }
    }

    function startGame() {
      score = 0;
      feedbackEl.textContent = '';
      questionPool = buildAllQuestions();

      document.body.classList.remove('win-bg', 'lose-bg', 'neutral-bg');
      endArea.classList.add('hidden');
      playArea.classList.remove('hidden');

      nextQuestion();
    }

    optionButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const chosen = parseInt(btn.textContent, 10);
        handleChoice(chosen);
      });
    });

    skipBtn.addEventListener('click', skipQuestion);
    endBtn.addEventListener('click', endGame);
    restartBtn.addEventListener('click', startGame);

    // Start the game on load
    startGame();
  </script>

</body>
</html>
